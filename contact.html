<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Royal Barbershop</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="page-wrap">
  <nav class="navbar" id="siteNavbar"></nav>

  <main class="main">
    <section class="hero">
      <div class="hero-bg" style="background-image:url('https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=1200&q=60');"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1><span class="accent">Contact Us</span></h1>
        <p>Have questions or need assistance with your booking? Reach out to our Siniloan branch.</p>
      </div>
    </section>

    <div class="container">
      <div class="contact-grid">
        <div>
          <h2>Send us a Message</h2>
          <div class="field">
            <label>Full Name</label>
            <input type="text" id="cName" placeholder="Juan Dela Cruz">
          </div>
          <div class="field">
            <label>Contact Number</label>
            <input type="tel" id="cPhone" placeholder="0912 345 6789">
          </div>
          <div class="field">
            <label>Your Message</label>
            <textarea id="cMessage" placeholder="How can we help you?"></textarea>
          </div>
          <input type="text" id="cHoneypot" name="website" autocomplete="off" tabindex="-1" style="position:absolute;left:-9999px;opacity:0;" aria-hidden="true">
          <button class="btn-gold" id="sendBtn" style="width:auto;padding:13px 26px;"><img src="icons/message-icon.PNG" class="ui-icon" alt=""> Send Message</button>
        </div>
        <div>
          <h2>Royal Barbershop HQ</h2>
          <div class="contact-info-row"><span class="ic"><img src="icons/location-icon.PNG" class="ui-icon" alt=""></span> Brgy. J. Rizal, Siniloan, Laguna</div>
          <div class="contact-info-row"><span class="ic"><img src="icons/phone-icon.PNG" class="ui-icon" alt=""></span> +63 912 345 6789</div>
          <div class="contact-info-row"><span class="ic"><img src="icons/time-icon.PNG" class="ui-icon" alt=""></span> Monday - Sunday, 9:00 AM &ndash; 8:00 PM</div>
          <div class="map-embed">
            <iframe src="https://www.google.com/maps?q=Siniloan,Laguna&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="siteFooter"></footer>
</div>

<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
